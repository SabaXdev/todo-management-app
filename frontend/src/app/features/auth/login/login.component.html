<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-12">
  <div class="card w-full max-w-md p-6 sm:p-8">
    <div class="flex flex-col items-center gap-2 text-center">
      <span class="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-brand-600 text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd" />
        </svg>
      </span>
      <h1 class="text-2xl font-semibold text-slate-900">Welcome back</h1>
      <p class="text-sm text-slate-500">Sign in to manage your todos.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4" novalidate>
      <app-error-message [message]="errorMessage()"></app-error-message>

      <div>
        <label for="email" class="label">Email</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          formControlName="email"
          class="input"
          [class.border-rose-400]="isInvalid('email')"
        />
        @if (isInvalid('email')) {
          <p class="mt-1 text-xs text-rose-600">Please enter a valid email address.</p>
        }
      </div>

      <div>
        <label for="password" class="label">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          formControlName="password"
          class="input"
          [class.border-rose-400]="isInvalid('password')"
        />
        @if (isInvalid('password')) {
          <p class="mt-1 text-xs text-rose-600">Password is required.</p>
        }
      </div>

      <button type="submit" class="btn-primary w-full" [disabled]="submitting()">
        @if (submitting()) {
          <span class="h-4 w-4 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
          Signing in&hellip;
        } @else {
          Sign in
        }
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Don&apos;t have an account?
      <a [routerLink]="['/', appRoute.Register]" class="font-medium text-brand-600 hover:text-brand-700">
        Create one
      </a>
    </p>
  </div>
</div>
